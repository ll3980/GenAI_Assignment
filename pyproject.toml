[project]
name = "sps-genai-assignment2"
version = "2.0.0"
description = "Course FastAPI project extended with a trained CIFAR-10 CNN classifier"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi==0.142.2",
    "uvicorn==0.54.0",
    "spacy==3.8.16",
    "en-core-web-lg",
    "torch==2.5.1",
    "torchvision==0.20.1",
    "numpy==2.2.6",
    "Pillow==11.2.1",
    "python-multipart==0.0.20",
]

[tool.uv]
package = false

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
en-core-web-lg = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_lg-3.8.0/en_core_web_lg-3.8.0-py3-none-any.whl" }
torch = { index = "pytorch-cpu", marker = "sys_platform == 'win32' or (sys_platform == 'linux' and platform_machine == 'x86_64')" }
torchvision = { index = "pytorch-cpu", marker = "sys_platform == 'win32' or (sys_platform == 'linux' and platform_machine == 'x86_64')" }

[dependency-groups]
dev = ["httpx==0.28.1", "pytest==8.4.2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
